# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties (NeoForge / NeoGradle 7)

# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.2,27)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.2.0.59
# The Neo version range can use any version of Neo as bounds or match the loader version range
neo_version_range=[26.2,)
# The loader version range can only use the major version of Neo/FML as bounds
loader_version_range=[26,)

# Resource/data pack format for MC 26.2 (min/max_format scheme since 1.21.9)
pack_format_number=88

## Mod Properties

# The unique mod identifier for this mod. Must be lowercase in English locale.
mod_id=thaumcraft
# The human-readable display name of this mod.
mod_name=Thaumcraft
# The license for your mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=6.2.0+26.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=thaumcraft
# The authors of this mod. This is a simple text string that will be displayed in the mod list
mod_authors=Azanor, TheDarkTower314
# The description of this mod. This is a simple multiline text string that will be displayed in the mod list
mod_description=Thaumcraft is a mod about magic, research, and discovery. Adding magical items, blocks, and creatures to help you on your journey.

# Curios API (replaces Baubles) - NeoForge build for 26.2
curios_version=16.0.0+26.2

# JEI (Just Enough Items) for recipe viewing in dev environment
jei_version=30.24.0.167
