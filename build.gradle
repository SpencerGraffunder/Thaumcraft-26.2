plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// MC 26.3 ships Java 25 to end users, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenLocal()
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://maven.blamejared.com" }
}

runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources'; srcDir 'src/main/templates' }

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "net.neoforged:neoforge:${neo_version}"
    // HARD runtime dependency: 8 item classes implement ICuriosItemHandler
    // (focus pouch + baubles); compileOnly caused NoClassDefFoundError at mod construction.
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// ---------------------------------------------------------------------------
// Use the PATCHED (NeoForge interface-injected) Minecraft jar for compilation.
//
// userdev's `selectRawArtifact` task publishes the *raw* (vanilla, un-patched)
// MC jar into the local `ng_dummy_ng` ivy repository, and that raw jar ends up
// first on the compile classpath as the `net.neoforged:neoforge` artifact.
// The raw jar lacks every NeoForge-injected hook the mod relies on
// (ServerPlayer.openMenu(MenuProvider, Consumer), public Player.closeContainer,
//  Item implements IItemExtension, ItemStack implements IItemStackExtension,
//  Level implements ILevelExtension, ValueInput extends ValueInputExtension,
//  RecipeManager.recipeMap(), BoneMealItem.applyBonemeal, ...), so compiling
// against it produces ~140 spurious "cannot find symbol" errors even though the
// code is correct for the real runtime (minecraft-client-patched).
//
// The correct patched jar is produced by the local neoForm pipeline at
//   build/neoForm/neoFormJoined<mc_version>-<n>/steps/recompile/outputs.jar
// (identical API surface to the runtime minecraft-client-patched jar).
//
// On CI (env CI=true, set by GitHub Actions), the NeoGradle userdev plugin
// auto-disables the decompiler and runs the binary-patch pipeline instead:
// PROCESS_MINECRAFT_JAR applies NeoForge's binary patches, then the AT and
// interface-injection tasks run, and selectRawArtifact publishes the resulting
// fully-patched jar directly as the ng_dummy artifact. No recompile output
// exists in that mode, so the swap below detects the already-patched ng_dummy
// and skips.
//
// In local source mode this task re-applies that patched jar over the raw
// artifact after userdev selects it, so compilation sees the full API. It does
// NOT declare the target as an output (that is owned by selectRawArtifact);
// it is forced to always run.
// ---------------------------------------------------------------------------
// Resolve the recompiled patched jar dynamically: prefer the neoForm directory
// for the CURRENT minecraft_version (e.g. neoFormJoined26.3-1), fall back to the
// most recently modified neoFormJoined*/steps/recompile/outputs.jar otherwise.
// The directory suffix is assigned by the neoForm pipeline, so we glob instead
// of hardcoding it.
def findPatchedMcJar = {
    def base = project.file("build/neoForm")
    def dirs = base.listFiles()?.findAll { it.directory && it.name.startsWith("neoFormJoined") } ?: []
    def match = dirs.findAll { it.name.startsWith("neoFormJoined${minecraft_version}") }
    if (match.isEmpty()) match = dirs
    def candidates = match.collect { new File(it, "steps/recompile/outputs.jar") }.findAll { it.exists() }
    if (candidates.isEmpty()) return null
    return candidates.max { it.lastModified() }
}
def ngDummyJar = project.file(".gradle/repositories/ng_dummy_ng/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}.jar")

// Detect whether an MC jar is NeoForge-patched. A patched Item.class references
// the NeoForge extension interfaces (IItemExtension & co — injected either by
// the binary patches on CI or by the source recompile locally); a raw vanilla
// Item.class has zero "neoforged" references.
def isPatchedMcJar = { File jar ->
    if (jar == null || !jar.exists() || jar.length() < 10000) return false
    try {
        def zf = new java.util.zip.ZipFile(jar)
        def entry = zf.getEntry("net/minecraft/world/item/Item.class")
        if (entry == null) { zf.close(); return false }
        def bytes = zf.getInputStream(entry).getBytes()
        zf.close()
        return new String(bytes, "ISO-8859-1").contains("neoforged")
    } catch (Throwable t) {
        logger.warn("isPatchedMcJar check failed for ${jar}: ${t}")
        return false
    }
}

// Swap the raw (vanilla) MC jar for the patched one immediately before javac runs.
// doFirst runs after all upstream tasks (incl. selectRawArtifact, which would
// otherwise leave the vanilla jar in place) and before the compiler reads the
// classpath files, so javac sees the full NeoForge-injected API surface.
//
// Two pipeline modes exist (NeoGradle userdev picks based on the CI env var):
//  - LOCAL (source mode): full decompile -> patch -> recompile pipeline. The
//    recompiled jar lands at build/neoForm/.../recompile/outputs.jar while
//    selectRawArtifact publishes only a stub into ng_dummy — so we swap the
//    recompiled jar into the ng_dummy slot here. Note: `neoFormRecompile`
//    depends on `neoFormPatchUserDev`, which can have failing patch hunks on
//    some NeoForge versions; a tolerated partial run is fine as long as the
//    previously recompiled jar is present (see the hardening below).
//  - CI (binary mode): the decompiler auto-disables when CI=true/CI=1, and the
//    pipeline becomes neoFormSetup (PROCESS_MINECRAFT_JAR applies NeoForge's
//    binary patches) -> neoFormApplyAccessTransformer ->
//    neoFormApplyInterfaceInjections. selectRawArtifact publishes that fully
//    patched jar directly into ng_dummy — no recompile output is produced and
//    no swap is needed, so we detect the patched jar and skip.
tasks.named('compileJava').configure {
    doFirst {
        if (isPatchedMcJar(ngDummyJar)) {
            // Binary-patch mode (CI=true or neogradle.subsystems.decompiler.enabled=false):
            // ng_dummy is already the fully-patched jar produced by the
            // PMJ+AT+II pipeline and is the authoritative compile target.
            // Never swap in a source-pipeline recompile jar in this mode —
            // stale recompile outputs may carry APIs that diverge from the
            // binary-patched runtime (see BlockStateBase.getMapColor incident).
            logger.lifecycle("ng_dummy MC artifact is already NeoForge-patched (binary-patch mode); skipping swap")
        } else {
            // Source mode: selectRawArtifact publishes only a stub into ng_dummy,
            // so swap the recompiled jar into the ng_dummy slot to get the
            // patched jar onto the compile classpath.
            def patchedMcJar = findPatchedMcJar()
            if (patchedMcJar == null || !isPatchedMcJar(patchedMcJar)) {
                throw new GradleException("patched MC jar missing under build/neoForm/ and ng_dummy is not patched — run the neoForm pipeline (neoFormRecompile) first")
            }
            if (!ngDummyJar.exists() || ngDummyJar.bytes != patchedMcJar.readBytes()) {
                ngDummyJar.parentFile.mkdirs()
                ngDummyJar.bytes = patchedMcJar.readBytes()
                logger.lifecycle("swapped raw ng_dummy MC artifact -> patched MC jar for compilation: ${patchedMcJar}")
            }
        }
    }
}

// ---------------------------------------------------------------------------
// neoForm pipeline hardening (NeoForge 26.2 / 26.3)
//
// The neoForm pipeline (neoFormDecompile -> neoFormPatch -> neoFormPatchUserDev ->
// neoFormTransformSource -> neoFormRecompile) is a dependency of selectRawArtifact,
// which feeds the net.neoforged:neoforge compile artifact. When its cache is
// invalidated the pipeline re-runs, and neoFormPatchUserDev may fail: some userdev
// patch hunks (e.g. CustomPacketPayload, SpawnPlacements, Block on 26.2) do not
// apply to the freshly-decompiled source. Those hunks inject NeoForge API hooks
// that the recompiled jar produced by a successful pipeline run already contains
// (build/neoForm/.../recompile/outputs.jar — identical API surface to the runtime
// minecraft-client-patched jar).
//
// So we:
//   1. Tolerate the neoFormPatchUserDev failure — its patched-source output is still
//      produced (the rejected hunks are the only loss, and we don't recompile from
//      that source).
//   2. Skip neoFormRecompile while the good recompiled jar is present, so it is not
//      overwritten by a jar built from the partially-patched source.
// The compileJava.doFirst swap above then substitutes the good recompiled jar for the
// raw artifact, so javac sees the full NeoForge-injected API surface.
// ---------------------------------------------------------------------------
tasks.matching { it.name == 'neoFormPatchUserDev' }.configureEach { t ->
    def originalActions = t.actions.toList()
    t.actions.clear()
    t.actions.add({ Task task ->
        try {
            originalActions.each { it.execute(task) }
        } catch (Throwable e) {
            logger.warn("neoFormPatchUserDev rejected hunks tolerated (good recompiled jar reused): ${e.message}")
        }
    } as org.gradle.api.Action)
}
tasks.matching { it.name == 'neoFormRecompile' }.configureEach {
    // Reuse the good recompiled jar if present; only regenerate it if it is missing.
    onlyIf { findPatchedMcJar() == null }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version,
            neo_version_range   : neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
            pack_format_number  : pack_format_number
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
}

// Fix decompiler artifacts after patch step: remove @Override on methods that don't override base class.
project.afterEvaluate {
    def patchTask = tasks.findByName('neoFormPatch')
    def recompileTask = tasks.findByName('neoFormRecompile')
    if (patchTask != null && recompileTask != null) {
        def fixTask = tasks.register('fixNeoFormArtifacts') {
            mustRunAfter(tasks.named('neoFormTransformSource'))
            doLast {
                // Resolve the transformSource dir dynamically (neoFormJoined<mc>-<n>)
                def baseDir = new File(project.layout.buildDirectory.get().asFile, "neoForm")
                def candidates = baseDir.listFiles()?.findAll { it.directory && it.name.startsWith("neoFormJoined") } ?: []
                // Prefer the current minecraft_version, else newest
                def match = candidates.findAll { it.name.startsWith("neoFormJoined${minecraft_version}") }
                if (match.isEmpty()) match = candidates
                def base = match.collect { new File(it, "steps/transformSource/transformed") }
                    .findAll { it.exists() }
                if (base.isEmpty()) {
                    logger.warn("fixNeoFormArtifacts: dir not found")
                    return
                }
                base = base.max { it.lastModified() }
                // Run Python script to fix artifacts
                def script = project.file('scripts/fix_neoform_artifacts.py')
                if (script.exists()) {
                    logger.info("fixNeoFormArtifacts: running ${script.absolutePath}")
                    def proc = ["python3", script.absolutePath, base.absolutePath].execute()
                    def outBuf = new StringBuffer()
                    def errBuf = new StringBuffer()
                    proc.consumeProcessOutput(outBuf, errBuf)
                    def exitCode = proc.waitFor()
                    if (outBuf.length() > 0) logger.info("fixNeoFormArtifacts: ${outBuf}")
                    if (errBuf.length() > 0) logger.error("fixNeoFormArtifacts stderr: ${errBuf}")
                    if (exitCode != 0) throw new GradleException("fixNeoFormArtifacts failed with exit=${exitCode}")
                }
            }
        }
        recompileTask.dependsOn(fixTask)
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
